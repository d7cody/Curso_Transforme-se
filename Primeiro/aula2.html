<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 02 - Css</title>
    <!-- usando estilos dentro do HtML -->

    <style>
      /* Cor de fundo */
      body {
        background-color: brown;
      }

      /* Cor de texto */
      h1 {
        text-align: center;
        color: aquamarine;
        background-color: black;
      }
    </style>
  </head>

  <body>
    <h1 style="background-color: rgb(114, 26, 255)">Estilos css</h1>
    <h1>Estilos css 2</h1>
    <h1>Estilos css 3</h1>

    <p style="color: beige; background-color: black">
      Lorem ipsum dolor, sit amet consectetur adipisicing elit. Unde distinctio
      odio, culpa cumque numquam reiciendis explicabo saepe, impedit possimus
      voluptates, modi totam. Quasi, unde est ipsam totam incidunt ex ipsa.
    </p>
  </body>
</html>
