<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabelas</title>

    <style>
      table,
      td {
        border: 1px solid brown;
        border-collapse: collapse;
      }
    </style>
  </head>
  <body>
    <!--Estrutura de tabela -->
    <!-- 
    TABLE
     TR - Table row
     TD - Table data
     TH - Table header
      -->
    <table>
      <!-- PRIMEIRA LINHA -->
      <tr>
        <th>PRODUTOS</th>
        <th>Preço</th>
      </tr>
      <!-- SEGUNDA LINHA -->
      <tr>
        <td>Café</td>
        <td>R$ 60,90</td>
      </tr>
      <!-- TERCEIRA LINHA -->
      <tr>
        <td>Arroz</td>
        <td>R$ 30,20</td>
      </tr>
    </table>
  </body>
</html>
