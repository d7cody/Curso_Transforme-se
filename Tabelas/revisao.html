<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Revisão</title>

    <link rel="stylesheet" href="/styles/style.css" />
  </head>
  <body>
    <!-- Tag table -->
    <table>
      <!-- Titulo da tabela -->
      <caption>
        Tabela de produtos
      </caption>

      <!-- Cabeçalho da tabela -->
      <thead>
        <tr>
          <!-- Theader -->
          <th>Produtos</th>
          <th>Preços</th>
        </tr>
      </thead>

      <!-- Corpo da tabela -->
      <tbody>
        <tr>
          <td>Arroz</td>
          <td>R$ 29,99</td>
        </tr>

        <tr>
          <td>Feijão</td>
          <td>R$ 15,99</td>
        </tr>

        <tr>
          <td>Açucar</td>
          <td>R$ 19,99</td>
        </tr>
      </tbody>

      <!-- Rodapé da tabela -->
      <tfoot>
        <tr>
          <td>Total de Produtos</td>
          <td>R$ 70,99</td>
        </tr>
      </tfoot>
      <!-- 
      rowspawn - 2 linhas
       Colspawn - 2 Colunas
        -->
    </table>
  </body>
</html>
